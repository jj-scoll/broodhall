# A pull request that changes shipped files cuts a release when it merges (autorelease.yml), so it
# must add an entry under "## Unreleased" in docs/guide/changelog.md; the release renames that
# heading to the version. The no-changelog label skips the check for changes no user would notice
# (tests, internals). Its own workflow, so adding or removing the label re-runs only this.
name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Entry under Unreleased
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/changelog.sh check "origin/$BASE_REF"
