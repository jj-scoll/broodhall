# Builds and publishes one GitHub release, v<version>, holding the assets BOTH launchers download:
#   guardrails_<os>_<arch>.tar.gz    (guardrails, CGO_ENABLED=0 cross-build; claude-tools_* in older releases)
#   memory_<os>_<arch>.tar.xz        (memory, cgo + DuckDB, one native runner per platform)
#   checksums.txt                    (sha256 of all eight; each run.sh picks its own asset's line)
# All three plugins share the version, so the tag is v<that version> for every one of them.
#
# Three ways in:
#   workflow_call      autorelease.yml, with its bump commit (ref) not yet on main and no tag yet:
#                      the release is a DRAFT, and autorelease pushes the commit and tag and
#                      publishes the draft only after every asset exists. (A tag pushed with
#                      GITHUB_TOKEN triggers no workflow, hence the direct call.)
#   push of a v* tag   the manual path: bump every plugin.json to the same X.Y.Z, tag, push.
#   workflow_dispatch  rebuild the release of an existing tag (for example after a failed run).
# Each stops unless the tag equals v<version> and all plugin.json versions are equal.
#
# Build jobs upload a plain .tar (it keeps the exec bit through the artifact); publish packs
# each memory tar with xz -9e on Linux, so the macOS runners need no xz.
# Each memory tarball holds the binary and ext/, the signed DuckDB extensions it loads (fts,
# httpfs, quack), so nothing is downloaded at runtime. DUCKDB_VERSION must match the DuckDB that
# duckdb-go in go.mod links; the tests LOAD the extensions, so a mismatch fails the build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, v<version>
        required: true
        type: string
      ref:
        description: Commit to build (default the tag). autorelease passes its unpushed bump commit.
        required: false
        type: string
        default: ""
      draft:
        description: Create a DRAFT release for a tag that does not exist yet; autorelease publishes it after pushing the commit and tag.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, v<version>
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}
  DUCKDB_VERSION: v2.0.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: Tag matches the shared plugin version
        run: |
          .github/scripts/check-versions.sh
          v=$(jq -r .version plugins/guardrails/.claude-plugin/plugin.json)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG, plugin.json version $v"; exit 1; }

  tools:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test ./cmd/guardrails/...
      - name: Build
        run: |
          rev=$(git rev-parse HEAD)
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*} arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.stampRev=$rev -X main.stampVersion=$TAG" \
              -o "build/${os}_$arch/guardrails" ./cmd/guardrails
            mkdir -p dist && tar -czf "dist/guardrails_${os}_$arch.tar.gz" -C "build/${os}_$arch" guardrails
          done
      - uses: actions/upload-artifact@v7
        with:
          name: guardrails
          path: dist/*.tar.gz
          if-no-files-found: error

  memory:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor at 2.35; a newer runner raises it.
          # duck is DuckDB's platform name in extensions.duckdb.org paths.
          - { os: linux, arch: amd64, duck: linux_amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, duck: linux_arm64, runner: ubuntu-22.04-arm }
          - { os: darwin, arch: amd64, duck: osx_amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, duck: osx_arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: DuckDB extensions
        run: |
          mkdir -p build/ext
          for e in fts httpfs quack; do
            curl -fsSL --retry 3 "https://extensions.duckdb.org/$DUCKDB_VERSION/${{ matrix.duck }}/$e.duckdb_extension.gz" |
              gunzip > "build/ext/$e.duckdb_extension"
          done
          ls -l build/ext
      - run: CGO_ENABLED=1 MEMORY_EXT_DIR="$PWD/build/ext" go test ./cmd/memory/...
      - name: Build
        run: |
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o build/memory ./cmd/memory
          file build/memory
          mkdir -p dist
          tar -cf "dist/memory_${{ matrix.os }}_${{ matrix.arch }}.tar" -C build memory ext
      - uses: actions/upload-artifact@v7
        with:
          name: memory_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*.tar
          if-no-files-found: error

  publish:
    needs: [tools, memory]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          xz -9e -T0 dist/*.tar
          cd dist && sha256sum -- *.tar.gz *.tar.xz > checksums.txt && cd ..
          [ "$(wc -l < dist/checksums.txt)" -eq 8 ] || { echo "expected 8 assets"; cat dist/checksums.txt; exit 1; }
          if [ "${DRAFT-}" = true ]; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$REF" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
