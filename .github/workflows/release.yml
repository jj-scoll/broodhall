# Push a tag v<version> matching plugins/guardrails/.claude-plugin/plugin.json to publish the
# static binaries scripts/run.sh downloads: claude-tools_<os>_<arch>.tar.gz and checksums.txt.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag matches the plugin version
        run: |
          v=$(jq -r .version plugins/guardrails/.claude-plugin/plugin.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, plugin.json version $v"; exit 1; }
      - run: CGO_ENABLED=0 go test ./...
      - name: Build
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*} arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.stampRev=$GITHUB_SHA" \
              -o "build/${os}_$arch/claude-tools" ./cmd/claude-tools
            mkdir -p dist && tar -czf "dist/claude-tools_${os}_$arch.tar.gz" -C "build/${os}_$arch" claude-tools
          done
          cd dist && sha256sum -- *.tar.gz > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
