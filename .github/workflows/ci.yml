# The plugin's binary is the CGO_ENABLED=0 build, so CI tests that build on Linux and macOS
# (macOS covers run.sh with its own sh, tar and shasum).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: shellcheck -s sh plugins/guardrails/scripts/run.sh
