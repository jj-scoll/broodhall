# The guardrails binary is the CGO_ENABLED=0 build, so CI tests that build on Linux and macOS
# (macOS covers run.sh with its own sh, tar and shasum). The memory binary needs cgo for DuckDB,
# so it has its own job, and the guardrails job names its package instead of ./...
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/claude-tools/...
      - run: go test ./cmd/claude-tools/...
      - run: bash plugins/memory/test/run_test.sh
      - if: runner.os == 'Linux'
        run: shellcheck -s sh plugins/guardrails/scripts/run.sh plugins/memory/scripts/run.sh plugins/context-guard/scripts/run.sh
      - if: runner.os == 'Linux'
        run: bash plugins/context-guard/test/run_test.sh

  # context-guard is a hooks module (hooks/context-guard.mjs); `claude plugin test` runs its
  # tests/*.test.ts in Claude Code's own test host, offline and without a login. Keep the
  # version in step with the minimum Claude Code the plugin README names. The runner's own
  # Node and npm install it.
  context-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global @anthropic-ai/claude-code@2.1.317
      - run: claude plugin test plugins/context-guard
      - run: claude plugin validate plugins/context-guard --strict

  memory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext_platform: linux_amd64
          - os: macos-latest
            ext_platform: osx_arm64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
      # Keep in step with release-memory.yml.
      DUCKDB_VERSION: v2.0.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: DuckDB extensions
        env:
          EXT_PLATFORM: ${{ matrix.ext_platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/ext"
          for e in fts httpfs quack; do
            curl -fsSL --retry 3 "https://extensions.duckdb.org/$DUCKDB_VERSION/$EXT_PLATFORM/$e.duckdb_extension.gz" |
              gunzip > "$RUNNER_TEMP/ext/$e.duckdb_extension"
          done
      - run: go vet ./cmd/memory/...
      - run: MEMORY_EXT_DIR="$RUNNER_TEMP/ext" go test ./cmd/memory/...
