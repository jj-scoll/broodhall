site_name: broodhall
site_url: https://jj-scoll.github.io/broodhall/
repo_url: https://github.com/jj-scoll/broodhall
site_author: Jeff Scollick

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Guide:
      - Home: index.md
      - Why: guide/why.md
      - Install: guide/install.md
      - First session: guide/first-session.md
      - Updating: guide/updating.md
      - Uninstall: guide/uninstall.md
      - Troubleshooting: guide/troubleshooting.md
  - Guardrails:
      - Overview: guardrails/index.md
      - Bash core: guardrails/bash-core.md
      - Git: guardrails/git.md
      - Settings files: guardrails/settings-files.md
      - Config gate: guardrails/config-gate.md
      - Secret files: guardrails/secret-files.md
      - Egress: guardrails/egress.md
      - PII: guardrails/pii.md
      - Session URLs: guardrails/session-urls.md
      - Nudges: guardrails/nudges.md
      - Read limits: guardrails/read-limits.md
      - Retry loops: guardrails/retry-loops.md
      - Status line: guardrails/statusline.md
      - Doctor: guardrails/doctor.md
      - Handoff gate: guardrails/handoff-gate.md
      - Receipt: guardrails/receipt.md
      - Options: guardrails/options.md
  - Memory:
      - Overview: memory/index.md
      - Privacy and redaction: memory/privacy.md
      - Options: memory/options.md
      - UI and Quack: memory/ui-and-quack.md
  - Reference:
      - Build: reference/build.md
      - Release: reference/release.md
      - Hooks: reference/hooks.md
